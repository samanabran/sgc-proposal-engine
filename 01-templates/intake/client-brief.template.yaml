# Client Brief (v2) — copy to 02-clients/{client}/00-intake/client-brief.yaml
# Complete BEFORE risk-assessment.yaml and pricing-worksheet.yaml.

client:
  legal_name:
  trading_name:
  jurisdiction:            # mainland | free_zone
  trn:                     # the CLIENT's TRN, if VAT-registered — distinct from SGC's own status (policy.yaml: vat.registered: false)
  vertical:                # matches a file under market-data/vertical-notes/, if one exists
  decision_maker:
  decision_maker_title:

scale:
  users_now:
  users_12mo:
  segment:                 # startup_boutique | smb | mid_market — derive from users_now against pricing/policy.yaml: segments.*.max_users

edition:
  requested_or_assumed:      # community | enterprise | unstated — capture what the client assumes, even if wrong; correct it explicitly in the draft, don't silently agree
  trigger_conditions_met: []   # any of editions.yaml: enterprise.trigger_conditions the brief reveals — empty list means Community by default

scope_signals:
  work_packages_requested: []       # names as they'll appear in pricing/hour-lookup.yaml
  modules_requested: []               # only relevant if edition trips to enterprise — names from pricing/saas-modules.yaml
  incumbent_system:
  incumbent_benchmark_aed_mo:
  portal_integrations_requested: []     # each requires the dependency checks in pricing/phase2-catalogue.yaml: portal_dependency_note
  migration_records:
  migration_files:
  data_quality_confidence:                # high | medium | low

commercial_signals:
  budget_rejected_aed:
  preferred_term_months:
  mobilisation_appetite:                    # full | partial | zero (note: zero currently triggers Option B, which is withdrawn — flag for the SDR, not silently accepted)

model:
  proposal_model:                             # SUB | PRJ | RET

notes:
  verbal_promises_logged:
  call_transcript_ref:
  adoption_deal_breaker:                        # true/false — capture explicitly if the client states adoption/usage risk as a primary concern, per clause-library/adoption.md
