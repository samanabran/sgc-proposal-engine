status_note: "assets/{logos,fonts}/ are still empty (.gitkeep only) as of this version — no logo files or font binaries have been supplied yet. assets/watermarks/ holds 18 pre-composited UAE landmark/heritage watermarks, supplied 2026-08-04 in three batches; user confirmed this set is final. Confidently identified (13): burj-khalifa.png, burj-al-arab.png, museum-of-the-future.png, dubai-frame.png, sheikh-zayed-mosque.png, emirates-towers.png, ain-dubai.png, louvre-abu-dhabi.png, cayan-tower-marina.png, jumeirah-mosque.png, heritage-ghaf-tree-dallah.png, heritage-mountain-village.png, heritage-al-fahidi-windtowers.png (last 3 are cultural/heritage motifs, not buildings — different category from the architectural landmarks). Filed as unconfirmed pending visual re-check (5): unconfirmed-palace-or-mosque.png, unconfirmed-etihad-towers.png, unconfirmed-dubai-opera.png, unconfirmed-loop-building.png, unconfirmed-stepped-tower.png — usable as backgrounds (identity doesn't affect rendering), just don't cite these as a specific named landmark until confirmed. Two supplied files across the batches were byte-identical duplicates and were not kept. Section-to-watermark rotation for the proposal template lives in assets/watermarks/rotation.yaml. These files are already faded/tinted to a finished watermark treatment (fully opaque pixels, ivory-tinted) — do NOT reapply the multiply/screen blend-mode treatment from the guidelines PDF chapter 6 on top of them, that spec is for raw source photography, not these pre-composited files. Any template referencing an asset path must fail loudly if the referenced file does not exist, not silently render without it."
