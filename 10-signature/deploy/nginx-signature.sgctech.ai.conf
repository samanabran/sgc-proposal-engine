upstream signature_handler { server 127.0.0.1:18765; }

server {
    listen 80;
    listen [::]:80;
    server_name signature.sgctech.ai;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name signature.sgctech.ai;

    ssl_certificate /etc/letsencrypt/live/signature.sgctech.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/signature.sgctech.ai/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    client_max_body_size 20m;

    location /healthz {
        proxy_pass http://signature_handler;
        proxy_set_header Host $host;
        access_log off;
    }

    location /webhooks/signature/zoho_sign/ {
        proxy_pass http://signature_handler;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / { return 404; }
}
