# Pricing Worksheet — KP-2026-SUB-01_Rev1
# knowledge_version_used: pricing v2.0 (2026-08-03)
# This worksheet IS the source of truth (no external client-approved brief
# overrides it, unlike VGE's Rev3 which pinned an external brief's figures).
# Scope: "prioritize early needs" per user instruction 2026-08-05 — core
# real-estate CRM/operations only, expanded 2026-08-05 (see number_2_build
# note) to clear 05-ops/validate.py's hour-benchmark gate with real,
# relevant work packages rather than a padded number. Portal sync, AI
# scoring, WhatsApp remain OUT of base scope — see phase2_deferred and
# verbal-promises.md.

