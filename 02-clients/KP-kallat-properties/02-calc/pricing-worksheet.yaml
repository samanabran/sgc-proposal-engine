number_2_build:
  # RECOMPUTED 2026-08-05 (v3.0): overlays.rollout_hours_per_user (the
  # mechanism that produced 120 rollout hours at the 525 AED/hr mid_market
  # blended rate) was DELETED per pricing-engine-cost-class-model.md
  # Rev.2 (D-4/D-5/D-9) -- it mixed Class A (training-content design),
  # Class B (genuine per-user provisioning), and Class C/A (hypercare
  # support) into one per-user multiplier, billed entirely at an L2
  # consultant rate. See manifest.yaml 2026-08-05 escalation for the
  # before/after framing (discovery, not a discount). Prior Rev1 figures
  # (192h, build_value 121,716) remain in git history, not restated here.
  delivery_hours:
    - { package: discovery,                       band: standard, hours: 5 }
    - { package: property_unit_register,            band: standard, hours: 8 }
    - { package: tenancies_contracts_reminders,       band: standard, hours: 9 }
    - { package: invoicing_trn,                        band: standard, hours: 5 }
    - { package: crm_leads,                              band: standard, hours: 6 }
    - { package: users_roles_agent_perf,                  band: standard, hours: 4 }
    - { package: reports_dashboard,                        band: standard, hours: 4 }
    - { package: data_migration_500,                        band: standard, hours: 6 }
  work_package_hours_subtotal: 47
  class_a_additions:
    # hour-lookup.yaml v2.1 entries -- the real, cited scope the deleted
    # overlay was informally covering, now separated by class.
    - { task: migration_record_validation_signoff, hours: 8, note: "moved from Class B per D-4 -- 500 fixed migration records, independent of N" }
    - { task: bulk_user_import_csv, hours: 5, trigger: "users_now=40 > 25" }
    - { task: training_content_design_multiagent, hours: 4, trigger: "users_now=40 > 10" }
  a_hours: 64                          # 47 + 8 + 5 + 4
  class_b:
    engine: "05-ops/pricing_engine.py: b_hours_for_branch(40, 'm'), class-b-task-inventory.yaml"
    total_hours: 10.734
    tasks:
      - { name: account_creation_credential, hours: 1.705, role: junior_passthrough, rate_aed: 90 }
      - { name: individual_onboarding,        hours: 3.411, role: junior_passthrough, rate_aed: 90 }
      - { name: per_agent_signoff,             hours: 1.535, role: junior_passthrough, rate_aed: 90 }
      - { name: bulk_path_validation,           hours: 0.500, role: junior_passthrough, rate_aed: 90 }
      - { name: exception_allowance,             hours: 1.333, role: junior_passthrough, rate_aed: 90 }
      - { name: role_permission_design,           hours: 2.250, role: business_analyst,   rate_aed: 450 }
    subtotal_aed: 1776.05
    note: "90 AED/hr = midpoint of rate-card.yaml passthrough_band (60-120) -- a policy choice within the sourced band, not itself derived. 450 AED/hr = rate-card.yaml:26 business_analyst, per D-5 (role/permission design is business-process design, not clerical work, exempt from the passthrough ceiling)."
  dev_hours_for_overlays: 74.734        # a_hours(64) + class_b.total_hours(10.734) -- base for QA/doc overlays
  documentation_hours: 4                 # max(min=2, 5% of 74.734=3.74), rounded
  qa_hours: 6                             # max(min=3, 8% of 74.734=5.98), rounded
  training_hours: 4                        # 2 sessions x 2h
  a_side_hours: 78                          # a_hours(64) + qa(6) + doc(4) + training(4) -- billed at segment blended rate
  rate_aed: 525                              # mid_market blended_rate_aed, pinned_role senior_consultant -- applies to a_side_hours ONLY, per V2/D-5 (no longer applied to Class B)
  rate_exists_on_card: true
  a_side_subtotal_aed: 40950                  # 78 x 525
  b_side_subtotal_aed: 1776.05                  # class_b.subtotal_aed, per-task-role rates (NOT the segment blended rate)
  subtotal_aed: 42726.05                         # a_side_subtotal_aed + b_side_subtotal_aed
  pm_aed: 6408.91                                 # subtotal_aed x 0.15 (mid_market pm_pct)
  contingency_aed: 2136.30                         # subtotal_aed x 0.05 (mid_market contingency_pct)
  build_value_core_aed: 51591.71                    # subtotal_aed x 1.15 x 1.05, compounded per runbook §3 formula
  hypercare:
    # support-training.yaml v2.1: hypercare.hypercare_golive_support --
    # one-time, priced at support_rate_aed, NOT part of the PM/contingency
    # compounding above (support capacity, not build/config engineering).
    pods: 8                                           # ceil(40/5)
    hours: 16                                          # 8 pods x 2h (M-branch)
    rate_aed: 280                                       # policy.yaml cost_to_serve.support_rate_aed
    cost_aed: 4480
  build_value_aed: 56072                                 # build_value_core_aed + hypercare.cost_aed, rounded
  total_hours_all_in: 100.734                             # a_side_hours(78) + class_b.total_hours(10.734) + hypercare.hours(16) -- reference only, not a single blended-rate multiplier
  total_hours: 100.734                                     # = total_hours_all_in, kept for validate.py check_4 (9.2h/user legacy benchmark, untouched per K-5) -- see note below
  internal_build_cost_aed: 15710                           # total_hours_all_in x policy.yaml internal_consultant_cost_aed_hr(150), rounded
  note_check_4: >
    100.734h vs check_4's 9.2h/user x 40 = 368h reference (floor at 50% = 184h)
    -- this NOW FAILS check_4, which it passed under Rev1's 192h. This is not
    a regression to hide: check_4's 9.2h/user constant is itself uncited
    "known debt" (CHANGELOG.md v2.2-revert entry) that the deleted overlay
    was originally added to satisfy (v2.1 origin note). A properly-classed
    recompute failing an unvalidated legacy floor is evidence the floor
    itself was never well-founded, not evidence this recompute is wrong
    (P7). Per K-5, check_4's literal is NOT touched by this build. This is
    reported as an open finding -- see pricing-engine-cost-class-model.md
    Rev.2 §L and CHANGELOG.md pricing v3.0 entry.

