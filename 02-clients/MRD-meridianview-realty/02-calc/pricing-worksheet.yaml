  users_now: 5
  users_12mo: 6
  segment: startup_boutique
  edition: community
  edition_trigger_reason: null       # not applicable — Community is correct, no trigger met
  term_months: 24
  modules: []                          # N/A on Community — zero licence cost
  work_packages: [discovery, property_unit_register, tenancies_contracts_reminders, invoicing_trn, maintenance_invoice_from_request, crm_leads, reports_dashboard]
  incumbent_benchmark_aed_mo: 1760       # PropSpace upper-range figure used deliberately: Odoo Community + implementation replaces a broader tool footprint (CRM + accounting + reporting) than PropSpace's narrower listings/CRM scope, so the upper end is the fairer comparison, not the lower end
  budget_rejected_aed: 30000

risk_assessment_ref: 02-calc/risk-assessment.yaml

number_1_cost_to_serve:
  licences_aed: 0                    # Community edition — see editions.yaml
  hosting_allocation_aed: 90           # 360 x (5/20)
  tooling_aed: 50
  support_labour_aed: 280               # ceil(5/5)=1 x 280
  account_mgmt_aed: 100                  # policy.yaml cost_to_serve.account_mgmt_aed.tier_5 (5 users)
  cts_total_aed: 520                       # 0 + 90 + 50 + 280 + 100
  platform_floor_aed: 650                    # 520 x 1.25

number_2_build:
  # MIGRATED 2026-08-05 (v3.0): unlike VGE, this worksheet has always been
  # its own source of truth (no external brief pin) -- so this migration
  # DOES change the quoted figures below, not just the audit trail. See
  # CHANGELOG.md pricing v3.0 VGE/MRD migration entry. This worksheet's
  # pre-migration documentation_hours (2, "floor binds") was ALREADY
  # correct -- confirmed as the control case proving 46 was the right
  # a_side_hours figure for this exact scope/segment/N combination (VGE
  # had the same inputs but a different, wrong, stored total of 52).
  delivery_hours:
    - { package: discovery,                          band: standard, hours: 5 }
    - { package: property_unit_register,               band: standard, hours: 8 }
    - { package: tenancies_contracts_reminders,           band: standard, hours: 9 }
    - { package: invoicing_trn,                             band: standard, hours: 5 }
    - { package: maintenance_invoice_from_request,           band: standard, hours: 5 }
    - { package: crm_leads,                                   band: simple,   hours: 3 }
    - { package: reports_dashboard,                             band: simple,   hours: 2 }
  work_package_hours_subtotal: 37
  class_a_additions: []   # none apply -- same reasoning as VGE: N=5 crosses no threshold, no migration in scope
  a_hours: 37
  class_b:
    engine: "05-ops/pricing_engine.py: b_hours_for_branch(5, 'm'), class-b-task-inventory.yaml"
    total_hours: 2.417
    tasks:
      - { name: account_creation_credential, hours: 0.417, role: junior_passthrough, rate_aed: 90 }
      - { name: individual_onboarding,        hours: 0.833, role: junior_passthrough, rate_aed: 90 }
      - { name: per_agent_signoff,             hours: 0.250, role: junior_passthrough, rate_aed: 90 }
      - { name: bulk_path_validation,           hours: 0.000, role: junior_passthrough, rate_aed: 90 }
      - { name: exception_allowance,             hours: 0.167, role: junior_passthrough, rate_aed: 90 }
      - { name: role_permission_design,           hours: 0.750, role: business_analyst,   rate_aed: 450 }
    subtotal_aed: 487.5    # pricing_engine.b_side_subtotal_aed(5), engine-emitted -- identical to VGE (same N, same inputs)
    note: "90 AED/hr = midpoint of rate-card.yaml passthrough_band (60-120). 450 AED/hr = rate-card.yaml:26 business_analyst, per D-5."
  dev_hours_for_overlays: 39.417        # a_hours(37) + class_b.total_hours(2.417)
  documentation_hours: 2      # max(overlays.documentation_hours_min=2, 5% x 39.417=1.97) — floor binds. Unchanged: this worksheet already had the correct figure.
  qa_hours: 3                   # max(overlays.qa_hours_min=3, 8% x 39.417=3.15) — unchanged
  training_hours: 4              # overlays.training_sessions(2) x training_hours_per_session(2) — unchanged
  a_side_hours: 46                  # a_hours(37) + qa(3) + doc(2) + training(4) -- SAME as VGE: identical scope/segment/N,
                                      # no legitimate differentiator between the two deals in any engine input (see
                                      # CHANGELOG.md pricing v3.0 entry -- this duplication is expected, not a bug)
  rate_aed: 280                      # policy.yaml segments.startup_boutique.blended_rate_aed — matches rate-card.yaml roles.startup_consultant
  rate_exists_on_card: true
  a_side_subtotal_aed: 12880           # 46 x 280 -- same number as the old subtotal_aed, coincidentally (46 was already correct)
  b_side_subtotal_aed: 487.5             # class_b.subtotal_aed, per-task-role rates (NOT the segment blended rate) -- NEW,
                                           # was never priced before v3.0 (this worksheet had no Class B concept at all)
  subtotal_aed: 13367.5                    # a_side_subtotal_aed + b_side_subtotal_aed -- CHANGED from 12880 (Class B now priced)
  pm_aed: 1336.75                            # subtotal_aed x segments.startup_boutique.pm_pct (0.10)
  contingency_aed: 668.38                     # subtotal_aed x segments.startup_boutique.contingency_pct (0.05)
  build_value_aed: 15999                       # subtotal_aed x 1.10 x 1.05 (compounded, runbook §3 formula -- CHANGED from
                                                 # this worksheet's own prior ADDITIVE method, 12880+1288+644=14812; migrating
                                                 # to the compounding convention already used by Kallat/Prosper/VGE-mechanical
                                                 # for consistency, not a new policy -- see hypercare below for the +hypercare step)
                                                 # = build_value_core_aed(15439.46) + hypercare.cost_aed(560), rounded
  build_value_core_aed: 15439.46               # subtotal_aed x 1.10 x 1.05, before hypercare
  hypercare:
    pods: 1                                       # ceil(5/5)
    hours: 2                                       # 1 pod x 2h (M-branch)
    rate_aed: 280                                   # policy.yaml cost_to_serve.support_rate_aed
    cost_aed: 560                                    # pricing_engine.hypercare_cost_aed(5), engine-emitted -- NEW, was never priced before
  total_hours_all_in: 50.417                              # a_side_hours(46) + class_b.total_hours(2.417) + hypercare.hours(2)
  total_hours: 50.417                                      # = total_hours_all_in — CHANGED from 46 (which was A-side only, correct as far as it went, but didn't yet include Class B/hypercare)
  internal_build_cost_aed: 7562                            # total_hours x policy.yaml internal_consultant_cost_aed_hr (150), rounded -- CHANGED from 6900 (46 x 150)

number_3_financing:
  mobilisation_aed: 5280        # build_value_aed(15999) x policy.yaml gates.default_mobilisation_pct (0.33), rounded -- CHANGED from 4888
  deferred_aed: 10719              # 15999 - 5280
  uplift_pct: 0.18                  # financing_uplift.months_24
  recovery_total_aed: 12648           # 10719 x 1.18, rounded -- CHANGED from 11710
  recovery_monthly_aed: 527             # 12648 / 24, rounded -- CHANGED from 488

assembly:
  option_a:
    mobilisation_aed: 5280
    platform_portion_aed_override:
      # RESTRUCTURED 2026-08-05, per review: platform_portion_aed was a policy
      # input (a deliberate competitive-positioning anchor) stored in a field
      # shaped like a formula output. Declared explicitly here instead --
      # UNCHANGED VALUE (1150), not recomputed off build_value or cts_total.
      anchor_aed: 1150
      mechanical_floor_aed: 650              # cts_total_aed(520) x policy.yaml gates.platform_floor_multiplier(1.25) -- the floor this anchor overrides
      multiplier_that_would_apply: 1.25       # gates.platform_floor_multiplier -- what 650 came from; 1150 is NOT this x anything, it is a separate policy choice
      rationale: "Market-defensible floor, well above the mechanical 650 floor, positioned under PropSpace's own upper range (incumbent_benchmark_aed_mo: 1760) -- a deliberate commercial-positioning decision, not a formula output. Preserved unchanged by this migration; only the recovery component below was recomputed, from the corrected build_value_aed."
    platform_portion_aed: 1150    # = platform_portion_aed_override.anchor_aed, kept as a plain field too since gates/assembly below reference this name
    subscription_aed: 1700          # (1150 + 527 = 1677) rounded to nearest 50 -- CHANGED from 1650. Recovery component
                                      # moved because build_value_aed corrected (14812->15999); platform_portion_aed did
                                      # NOT move (anchor preserved per platform_portion_aed_override above).
    year1_client_cost_aed: 25680      # 5280 + 12 x 1700 -- CHANGED from 24688
  # option_b (zero mobilisation) is WITHDRAWN — not offered, see payment-plans.yaml: withdrawn

payment_cadence: quarterly_in_advance   # meets policy.yaml gates.min_cadence (G33); quarterly billing = 1700 x 3 = 5100/quarter

exposure:
