  cash_peak_aed: 0                    # mobilisation (5280) + first quarter (5100) = 10380 collected at/near kickoff, comfortably ahead of the delivery-cost curve for a 50.417-hour build — see 02-calc/exposure-calculator.yaml
  economic_peak_aed: 0                 # staged delivery keeps internal cost accrual paced with collections
  cash_positive_by_day: 1                # cash-positive at kickoff itself

