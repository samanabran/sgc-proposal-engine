  budget_test:     { pass: true, applicable: false, note: "client explicitly stated no fixed CRM budget ('whatever you are proposing, that will be the first decision') — gate not applicable; AED 15k-60k/mo figures are ad-spend, not a CRM budget anchor, and are not used here" }

# ---------------------------------------------------------------------------
# Option B — Milestone Payment (full build paid at kickoff, no financing)
# Derived per payment-plans.yaml: one_time_no_subscription is refused
# ("hosting and support are recurring costs...") with an explicit counter:
# "offer build as one-time + platform recurring, minimum 12-month platform
# term." This is that counter, computed from figures already in this
# worksheet (build_value_aed, platform_portion_aed_mo) — no new number
# invented, no discount applied (platform_portion sits exactly at the G1
# floor with zero headroom, so no cadence discount can be layered on it).
# True multi-installment milestone billing (split across kickoff/mid-build/
# go-live rather than one lump sum) is payment-plans.yaml: milestone_or_usage
# (treatment: escalate, approval: sales_leadership) — NOT offered here
# without that sign-off; this option is the single-payment-at-kickoff case,
# which needs no escalation.
# ---------------------------------------------------------------------------
option_b_milestone_full_upfront:
  structure: build_full_upfront_platform_monthly   # payment-plans.yaml: one_time_structures, uplift: 0
  build_paid_at_kickoff_aed: 15327                   # = number_2_build.build_value_aed, paid in full, no financing
  financing_uplift_pct: 0.0
  monthly_platform_fee_aed: 1170                      # = assembly.platform_portion_aed_mo, no recovery component, no discount (G1 floor has zero headroom)
  minimum_term_months: 12                              # payment-plans.yaml counter-note: "minimum 12-month platform term"
  security_deposit_1mo_aed: 1680                        # unchanged — risk-band instrument (risk-security-matrix.yaml), independent of payment structure
  quarterly_billing_aed: 3510                             # 1,170 x 3
  kickoff_total_payable_aed: 20517                         # 15,327 (build) + 1,680 (deposit) + 3,510 (Q1)
  minimum_12mo_commitment_aed: 29367                        # 15,327 + 12 x 1,170
  note: "No G2 term-vs-recovery constraint applies (no deferred/financed remainder to recover), so the runbook's 24-month band default does not bind here; 12 months is the payment-plans.yaml minimum for this structure."

phase2_deferred:
  - item: "Automated call-analyzer / telephony integration"
    price: "NOT PRICED — no catalogue entry (see client-brief.yaml: escalated_uncatalogued_requests). Requires Commercial Desk scoping once RVN's telephony stack is known."
  - item: "Attendance / break-time tracking via existing sensor/badge system"
    price: "NOT PRICED — no catalogue entry (see client-brief.yaml: escalated_uncatalogued_requests). Requires Commercial Desk scoping once sensor vendor/API is known."
  - additional_user: "SUPERSEDED CITATION FIXED 2026-08-15 — phase2-catalogue.yaml v2.1 (effective 2026-08-05) replaced the flat AED 250/user/month additional_user rate with two components for growth beyond 7 seats: (1) onboarding_fee_per_marginal_user, one-time, computed via pricing_engine.py: marginal_user_fee(users_now_before_addition), not a fixed figure; (2) platform_capacity_fee, recurring monthly, banded per hosting.yaml Class C steps (1-20/21-50/51+), not per-head — RVN's 7-15 user range stays inside the 1-20 band, so this fee only changes if the band itself moves, not per added user. Neither component is a single quotable AED figure without running the actual formulas for a specific headcount; not computed here since no growth beyond 7 is confirmed."

exclusions_confirmed: true
