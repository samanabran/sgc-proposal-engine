escalations:
  - date: "2026-08-03"
    raised_by: "SGC Tech AI SDR"
    issue: >
      Earlier v1 Rev1/Rev2 documents under this client folder were built from
      invented data and an invented client identity (Elena von Geyern, 12
      users, smb segment, Big-4-style figures). The v2 hardening pass
      replaced the entire knowledge layer with corrected pricing policy and
      a hardened 41-gate system; the v1 history remains in 05-issued/ as
      the original artifacts (immutable, do not overwrite) but is no
      longer consistent with current knowledge-version policy.
    resolution: >
      A real discovery call (Otter-transcribed, dated 2026-08-03) and the
      CRM record (Lead ID 10119, per user-provided CRM summary and BANT
      qualification screenshot) confirmed the real client identity
      (Von Geyern Real Estate L.L.C, Dubai mainland) and decision-maker
      (Ms. Nadja, Owner — confirmed in the CRM Authority gate). This
      Rev3 is built on those facts plus the brief's §3 commercial figures,
      which are the single source of truth for the proposal.
  - date: "2026-08-03"
    raised_by: "SGC Tech AI SDR"
    issue: >
      Source-of-truth gap: the Otter transcript does not state a numeric
      rejection figure. The client probed two anchors ("is AED 30,000 too
      much? is 40,000 too much?") in the context of an upfront one-time
      integration fee, not a hard rejection. The brief uses AED 35,000 as
      a midpoint for gate-test purposes; the proposal prose uses the range
      language from the transcript verbatim.
    resolution: >
      Worksheet records budget_rejected_aed_low: 30000, _high: 40000,
      and _midpoint: 35000 (gate-test only). Proposal uses range language
      ("you indicated a range of AED 30,000–40,000 felt heavy as an upfront
      figure") rather than quoting a single midpoint figure the transcript
      does not contain.
  - date: "2026-08-03"
    raised_by: "SGC Tech AI SDR"
    issue: >
      The brief specifies "Ms. Nadja" as the contact; the Otter transcript
      addresses the SDR as "Miss" without capturing a name in text. The
      CRM Authority gate (BANT qualification, per user-provided screenshot)
      confirms "Ms. Nadja [Owner]" as the decision-maker.
    resolution: >
      Cover letter addresses "Ms. Nadja" per the brief and per the CRM
      Authority gate. Public LinkedIn / Instagram presence ("Valeria von
      Geyern") is not used as the addressing name — those records may be a
      different personal identity or a public-brand identity; addressing
      defaults to the CRM-confirmed business decision-maker.
  - date: "2026-08-04"
    raised_by: "SGC Tech AI SDR"
    issue: >
      Headcount discrepancy noticed during pre-issue QA: the CRM BANT
      Budget field states the company has "3 commission based employees,"
      while the brief §3 and the worksheet are built on 5 users
      (startup_boutique segment, 52h build benchmark for 5 users). Raised
      to the user before treating Rev3 as final.
    resolution: >
      User decision (2026-08-04): keep 5 users. The brief's §3 figures
      remain the single source of truth per runbook policy; the CRM
      BANT free-text figure ("3 commission based employees") is read as
      commission-earning agents specifically, not the full count of
      system users (which would also include the owner and any
      admin/back-office seats). No rebuild of the worksheet or proposal
      required. Note for a human reviewer: worth a one-line confirmation
      with the client at Kickoff that 5 named users is the correct
      starting count, since the Order Form ships with 3 included users
      + paid additional seats at AED 250/mo each.

