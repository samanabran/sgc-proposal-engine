  class_a_additions: []   # none apply: users_now=5 crosses neither bulk_user_import_csv's (>25) nor
                            # training_content_design_multiagent's (>10) threshold, and data_migration_500
                            # is not in this deal's work_packages -- migration_record_validation_signoff
                            # does not apply either.
  a_hours: 37                          # work_package_hours_subtotal (no class_a_additions apply)
  class_b:
