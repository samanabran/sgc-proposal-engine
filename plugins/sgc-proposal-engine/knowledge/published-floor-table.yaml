# SGC TECH AI — Published Floor Table (v1, desk-authored, shipped in SDR plugin)
# The desk authors this once. The SDR plugin treats it as read-only.
# The SDR-side validator (G42) refuses to proceed when a quoted
# subscription is below the corresponding cell.
#
# Convention: floor is the minimum monthly subscription (AED) that SGC
# will quote for the cell (users, edition, term_months, cadence). The
# desk may tighten a cell at any time by publishing a new version; the
# SDR plugin follows.
#
# Values below are conservative defaults. The desk must replace each
# `<TBD>` cell before this plugin is published to production. Until
# then, the approval-gate skill blocks on any cell that is `<TBD>` and
# escalates to desk.
version: 1.0
effective_from: 2026-08-04
currency: AED
unit: per_month
authored_by: "Commercial Desk — see PUBLISHING.md for the desk-side authoring skill"
review_required_before_publish: true

grid:
