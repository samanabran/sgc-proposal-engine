# What this table is NOT
not_a_rate_card: true
not_a_reservation_pricing: true
not_a_margin_floor: true
not_a_cost_to_serve: true
# The desk-only originals live in the desk plugin. This file is the
# *minimum quotable subscription* by cell. It is a single number per
# cell, padded so the SDR has room to discount within the published
# cadences and the ceiling calculation still binds.

# How the SDR uses this
usage:
  description: >
    At proposal time, the SDR looks up the cell corresponding to
    (users, edition, term_months, cadence). The proposed monthly
    subscription must be >= the cell value. If it would be below, the
    SDR escalates to the desk rather than proposing below floor.

  approval_gate_role: >
    The approval-gate skill (G42) cross-checks the proposed subscription
    against this table before producing the approval packet. Below
    floor → refuse to proceed and emit a `RESOLVE:` field on the
    approval request naming the cell and the proposed AED.

# Re-issue cadence
re_issue:
  trigger: "Any published floor change, padding change, or grid extension."
  method: "Bump version; publish via the desk-side published-floor-authoring skill; the SDR plugin receives the new file via sync."
  compatibility: "Cell schema is stable across minor versions; only additions are allowed in patch releases."
