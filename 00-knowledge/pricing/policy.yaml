# SGC TECH AI — Pricing Policy (v2, cash-risk hardened)
# Every gate and coefficient lives here. No agent hardcodes a percentage.
#
# v2 changes from v1 (see failure-modes/known-defects.md for the full
# case study): mobilisation raised 25% -> 33%; 24-month financing uplift
# raised 12% -> 18% pending reserve rebuild; vat.charge_vat flipped to
# false — SGC is NOT VAT-registered and has no TRN as of this version.
version: 3.0
effective_from: 2026-08-05
source: "v3.0 — rollout_hours_per_user overlay DELETED, replaced by class-b-task-inventory.yaml + cost-classes.md, see CHANGELOG.md"

# RESOLVED 2026-08-04 (see failure-modes/known-defects.md #21): this
# build's own source spec reintroduced the pre-correction smb and
# mid_market blended rates verbatim — the exact drift pattern
# known-defects.md #1 already documented once. On review, "don't invent
# numbers" governs fabricating market data, not preserving a rate known
# to be wrong in a live operational config that other SDRs price off
# without reading this comment. Re-pinned both to real rate-card.yaml
# roles, same treatment as startup_boutique. mid_market's rejected value
# is now a permanent regression guard in rate-card.yaml: forbidden_rates;
# smb's rejected value cannot be blanket-forbidden the same way because
# it is legitimately roles.qa_engineer's rate — instead, 05-ops/validate.py
# structurally checks that each segment's blended_rate_aed equals its
# pinned role's rate_aed_hr below, not just that the number exists
# somewhere on the card.
segments:
  startup_boutique:  { max_users: 10,  blended_rate_aed: 280, pm_pct: 0.10, contingency_pct: 0.05, pinned_role: startup_consultant }
  smb:               { max_users: 30,  blended_rate_aed: 395, pm_pct: 0.15, contingency_pct: 0.05, pinned_role: consultant }
  mid_market:        { max_users: 999, blended_rate_aed: 525, pm_pct: 0.15, contingency_pct: 0.05, pinned_role: senior_consultant }

overlays:
  documentation_hours_min: 2
  documentation_pct_of_dev: 0.05
  qa_pct_of_delivery: 0.08
  qa_hours_min: 3
  training_sessions: 2
  training_hours_per_session: 2
  # DELETED 2026-08-05 (v3.0): overlays.rollout_hours_per_user (4h) and
  # overlays.rollout_hours_free_users (10), added v2.1 same day. Deletion,
  # not retuning, per P11 -- the overlay was justified by "it makes the
  # hour-benchmark gate pass" (KP-2026-SUB-01 could only reach ~52-60h
  # using hour-lookup.yaml alone, against a 9.2h/user reference expecting
  # ~368h for 40 users), which is exactly the pattern P11 forbids keeping.
  # It also bundled three genuinely different kinds of work into one flat
  # per-user multiplier -- role/permission design (Class A, scope-driven),
  # training-content design (Class A), hypercare support (Class C/A
  # one-time) -- alongside actual Class B per-user provisioning, and
  # billed all of it at the segment blended rate (525 AED/hr for Kallat),
  # which is also a real, demonstrated V2 rate-mix-ceiling violation on
  # work that is structurally Class B (see validate.py check_v2).
  #
  # Replaced by (all added 2026-08-05, BEFORE this deletion landed, so no
  # commit priced the corpus with neither mechanism -- D-9):
  #   - class-b-task-inventory.yaml -- genuine Class B per-user tasks,
  #     bottom-up, Wright's-law learning curve, per-task-role ceiling
  #   - hour-lookup.yaml: migration_record_validation_signoff,
  #     bulk_user_import_csv, training_content_design_multiagent (Class A)
  #   - support-training.yaml: hypercare.hypercare_golive_support (Class A
  #     one-time, support-rate-priced)
  #
  # The corrected bottom-up Class B figure for Kallat (N=40) is ~10.7h
  # against this deleted overlay's 120h -- a GAP, not a saving: the Class
  # A/C lines above absorb some of the difference, but their own O/M/P
  # estimates are themselves new and Grade D (no delivered actual exists
  # yet for any of them). See CHANGELOG.md pricing v3.0 and
  # .omc/plans/pricing-engine-cost-class-model.md Rev.2 for the full
  # derivation. Per PRECEDENCE.md's own rule: deleted and logged here,
  # not left dormant as a comment for a future read to silently revive.

cost_to_serve:
  hosting_node_true_cost_aed: 360        # NOT the 990 list price — see hosting.yaml note
  hosting_node_user_capacity: 20
  tooling_flat_aed: 50
  support_hours_per_5_users: 1
  support_rate_aed: 280
  account_mgmt_aed: { tier_5: 100, tier_10: 200, tier_20: 350 }
  internal_consultant_cost_aed_hr: 150

financing_uplift:
  months_12: 0.06
  months_18: 0.09
  months_24: 0.18                          # RAISED from 0.12 — capital scarcity, see review_trigger
  zero_mobilisation_surcharge: 0.03
  review_trigger: "reduce months_24 to 0.12 when liquid reserves reach 3 months opex — see 07-protection/exposure/portfolio-limits.yaml runway.target_months"

gates:
  platform_floor_multiplier: 1.25
  min_gross_margin: 0.30
  absolute_margin_floor: 0.25              # G23 — no approver may go below this, ever
  target_gross_margin: 0.35
  default_mobilisation_pct: 0.33           # RAISED from 0.25 — see known-defects.md
  max_multiple_of_incumbent: 1.30
  review_cadence_monthly_threshold_aed: 2500
  cash_positive_within_days: 30            # G32
  min_cadence: quarterly_in_advance         # G33 — until reserves reach 3mo opex, see portfolio-limits.yaml

vat:
  standard_rate: 0.05
  registered: false                          # LOCKED until a TRN is actually issued — do not flip this speculatively
  mandatory_threshold_aed: 375000
  voluntary_threshold_aed: 187500
  late_registration_penalty_aed: 10000       # plus retroactive liability from the date registration became mandatory
  free_zone_exempt: false                     # DO NOT CHANGE — Designated Zone treatment applies to GOODS only, services are standard-rated even inside one; see market-data/vertical-notes/uae-tax-vat.md
  charge_vat: false                            # illegal to charge VAT while unregistered — see clause-library/vat-uae.md and vat-gross-up.md
