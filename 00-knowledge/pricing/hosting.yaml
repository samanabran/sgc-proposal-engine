# SGC TECH AI — Revised Cloud Hosting
# Source: commercial-pricing-revised-v2.xlsx, sheet "Cloud Hosting"
# Managed Odoo hosting on Contabo / Hetzner + 24/7 monitoring.
version: 2.0
effective_from: 2026-08-03

# COST BASIS NOTE — read before using this file in a cost-to-serve
# calculation: the prices below are LIST prices, used only when hosting
# is sold as its own separate line item. When hosting is bundled into a
# subscription platform_portion (the normal case), cost it in
# number_1_cost_to_serve at TRUE infrastructure cost —
# policy.yaml: cost_to_serve.hosting_node_true_cost_aed (360/node) — not
# the list price here. Using list price inside a bundled cost-to-serve
# calculation overstates cost and silently erodes the margin gate (G8).

tiers:
  foundation:
    spec: "2 vCPU · 4 GB RAM · 50 GB SSD"
    max_users: 20
    price_aed_mo: 990
  growth:
    spec: "4 vCPU · 8 GB RAM · 100 GB SSD"
    max_users: 50
    price_aed_mo: 1950
  enterprise:
    spec: "8 vCPU · 16 GB RAM · 200 GB SSD · HA"
    max_users: null   # unlimited
    price_aed_mo: 3490

aws_passthrough_reference:
  # AWS pass-through pricing is unchanged and billed directly by AWS, not
  # marked up under SGC hosting tiers above. Use only when a client mandates
  # AWS for compliance/residency reasons.
  ec2_t3_medium_aed_mo: 120
  ec2_r6g_large_aed_mo: 350

notes:
  - "Foundation caps at 20 users to match cost_to_serve.hosting_node_user_capacity in policy.yaml — do not oversell a tier past its user cap."
