    alternative_offered: "Odoo's native manual/kiosk check-in, already active and evidenced as used — offered as-is, not oversold as hardware integration."
    quotable_as: "Discovery-first (device vendor/protocol unknown) — no catalogue basis, per this repo's own custom-request-catalog.yaml Band 3 discipline (discovery fee, not a guessed figure)."

  property_portal_feeds:
    status: excluded
    fixed_price: null
    evidence: "Not evidenced as built or active in the estate inventory — no portal-sync table found for demo_presentation; phase2-catalogue.yaml carries real published one-time reference prices for two named portals (Property Finder, Bayut/Dubizzle) in a DIFFERENT catalogue (custom/on-demand work), not this template model."
    alternative_offered: "Manual listing export/upload to portals, or the client's own existing portal-sync tooling if any."
    quotable_as: "custom-request-catalog.yaml: additional_portal_connection (12h standard, real governed catalogue row, per-portal) — quoted from THAT catalogue, never as a template-model fixed line."
