# SGC TECH AI — Pricing Model v4: Product-Plus-Services Catalogue
# NEW FILE (2026-08-16). Replaces build-hours pricing with four lines, one
# of them hourly. Every figure below is owner-stated as of 2026-08-16
# unless otherwise cited; provenance is stated per line, not assumed.
#
# This file does NOT replace hour-lookup.yaml / class-b-task-inventory.yaml
# / cost-classes.md — those remain the INTERNAL cost/effort model (what a
# capability costs SGC to build). This file is the CLIENT-FACING commercial
# structure (what a capability is sold for). The two are related but
# distinct: a fixed line here can, and does, have an internal hour estimate
# behind it for margin-checking purposes (see internal_build_estimate_hours
# fields below and 05-ops/pricing_engine.py: deal_guard_verdict()) without
# the client ever seeing hours × rate.
version: 4.0
effective_from: 2026-08-16
source: "Owner-directed pricing model v4, stated in conversation 2026-08-16. See HANDOVER.md decisions #14-#17 and CHANGELOG.md pricing v4.0 entry."

# ===========================================================================
# LINE 1 — PLATFORM FEE (fixed, NOT hour-derived)
# ===========================================================================
platform_fee:
  amount_aed: 14000
  basis: fixed
  rationale: >
    The asset exists, is deployed, and carries first-implementation risk
    already absorbed — this is a product fee for a working system, not a
    labour charge for building one from zero. It must be structurally
    impossible to derive this figure from any hour count anywhere in the
    engine or the client-facing output — see
    05-ops/test_pricing_engine.py T24, which asserts the figure is
    unchanged under a mutated hour input.
  never_shown_as: "hours × rate — this line prints as a flat product fee on every client document, never as a computed hourly total (Part 5.4)."
  provenance: "Owner-stated 2026-08-16, conversation. No repo artifact establishes this figure independently — recorded here as the source of truth going forward."

# ===========================================================================
# LINE 2 — MODULES (fixed price each, evidenced scope only)
# ===========================================================================
modules:
  lead_capture_pipeline:
    amount_aed: 3000
    scope: "Meta/Google/web lead intake into CRM — see 00-intake/demo-presentation-inventory-2026-08-16.md R1 (crm_lead_ingestion_hub module, class BUILT: code exists, installed, zero rows in its own log table despite an actively-firing retry cron — no evidence any inbound webhook was ever received)."
    risk_category: [git_untracked, no_persisted_output_evidence]
    risk_category_basis: "Maps to crm_lead_ingestion_hub — one of the 4 named git-untracked modules (§2 of the inventory) AND its own log table shows 0 persisted rows despite a firing cron (§6.1). Both conditions apply; contingency_pct_for() takes the max (50%, not_persisted_output_evidence), per the combination_rule."
    warrant_tier: T2
    provenance: "Owner-stated 2026-08-16."

  property_listing_management:
    amount_aed: 3500
    scope: "Property/unit register, listing status, media — see sgc_offplan_rental_property_management, the largest git-tracked SGC module in the estate inventory (581/584 files tracked)."
    risk_category: [git_tracked_deployed_before]
    risk_category_basis: "sgc_offplan_rental_property_management is git-tracked (581/584 files, the 3-file gap is __pycache__/one stray script, verified) and installed with real persisted data (property_project=6, property_sub_project=5, rent_contract=4 rows, per the inventory §5.1)."
    warrant_tier: T2
    provenance: "Owner-stated 2026-08-16."

  commission_and_deals:
    amount_aed: 3500
    scope: "Commission calculation, split/clawback, deal pipeline — see sgc_commission and sgc_deals_management, both git-tracked, installed."
    risk_category: [git_tracked_deployed_before]
    risk_category_basis: "Both sgc_commission and sgc_deals_management are git-tracked (73/73 and 45/45 files respectively, per the inventory §4.3) and installed. NOTE: this does not cover the ir_rule/multi-agent-visibility gap on these same models — that gap is priced and risk-tagged separately as its own line, multi_agent_access_control, below; not double-counted here."
    warrant_tier: T2
    provenance: "Owner-stated 2026-08-16."

  multi_agent_access_control:
    amount_aed: 3500
    is_a_real_build_line: true
    note: >
      NOT packaging. This is real, needed engineering work, priced as such
      — see the evidence below for why it cannot be sold as "already
      included."
    evidence: "00-intake/demo-presentation-inventory-2026-08-16.md §6.4 (Phase 5.5, access control): ir_rule (row-level record rules) exist for only 18 of ~90 custom models/tables in the estate inventory, and are ABSENT from the commission and deals-management models specifically — the two most likely to need per-agent visibility in a real multi-agent brokerage. ir_model_access (basic CRUD) is populated everywhere (168 rows) but that is not the same protection: CRUD access says an agent CAN read/write commission or deal records at all; it says nothing about whether Agent A can see Agent B's."
    internal_build_estimate_hours: 7
    internal_build_estimate_note: "Owner-stated 2026-08-16. Grade D — no delivered actual exists yet for this specific line (writing ir.rule domains on sgc_commission/sgc_deals_management, both already-deployed git-tracked modules). Risk-adjusted per Part 3's contingency schedule before being used in any margin check, never used raw."
    risk_category: [git_tracked_deployed_before]
    risk_category_basis: "The WORK (new ir.rule domains) targets sgc_commission/sgc_deals_management, both git-tracked and already deployed — the risk category attaches to where the work lands, not to the fact that the specific rules are new. Risk-adjusted: 7h x 1.15 = 8.05h (pe.risk_adjusted_hours(7, 'git_tracked_deployed_before'))."
    warrant_tier: T2
    provenance: "Owner-stated 2026-08-16; evidence citation is the estate inventory (verified repo artifact, not owner-stated)."

  reporting_and_dashboards:
    amount_aed: 2500
    scope: "Standard reports/dashboards on top of the above modules."
    risk_category: [git_untracked]
    risk_category_basis: "INFERENCE, not a direct 1:1 repo mapping — stated as such so it can be corrected. The closest evidenced real-estate-inventory capability under this name is sgc_crm_dashboard ('Run scheduled reports' cron, actively firing per §6.1) — but that module is git-untracked (§2), so this line is tagged at that risk level rather than assumed clean. If this module instead means sgc_dynamic_financial_report (git-tracked, but 0 rows across every scheduling table per §5.1 — 'no persisted output evidence,' the same 50% ceiling), the risk category is unaffected either way."
    warrant_tier: T2
    provenance: "Owner-stated 2026-08-16."

modules_subtotal_aed: 16000   # 3000+3500+3500+3500+2500, all five modules — computed and verified by direct execution (pe.modules_subtotal_aed()) before this file was committed; a standing drift-guard test is added in the pricing v4 Part 4 commit

# ===========================================================================
# LINE 3 — MIGRATION (banded by record count)
# ===========================================================================
migration_bands:
  risk_category: [migration]   # flat 50% on every band, per policy.yaml: contingency_schedule.migration — independent of any module's own tracked/untracked status
  band_1: { to_records: 1000,  amount_aed: 2500 }
  band_2: { to_records: 5000,  amount_aed: 5000 }
  band_3: { to_records: 20000, amount_aed: 8000 }
  above_band_3:
    to_records: null
    amount_aed: null
    treatment: UNPRICED
    routed_to: commercial_desk
    note: >
      Above 20,000 records is explicitly UNPRICED, not estimated by
      extrapolation from the bands above — preserves the existing T16
      end-to-end behaviour (migration record counts beyond a governed
      threshold escalate rather than get a fabricated number). NOTE
      (honesty disclosure, 2026-08-16): no test literally numbered T16
      existed in 05-ops/test_pricing_engine.py before this pricing v4
      pass — grepped the full suite (T1-T10, T12) and found no T16. This
      band's UNPRICED/Commercial-Desk-routing behaviour and its T16 test
      are both NEW as of this commit, not a pre-existing mechanism being
      preserved. Built to the same specification the brief described as
      if it already existed, and will now genuinely exist and be tested
      as T16/T26 going forward.
  provenance: "Owner-stated 2026-08-16."

# ===========================================================================
# LINE 4 — ENHANCEMENT (hourly — the one hourly line in this model)
# ===========================================================================
enhancement:
  rate_aed_hr: 550
  net_after_commission_aed_hr: 473    # 550 * (1 - 0.14) = 473, computed
  note: >
    Fine for pricing marginal/incremental hours on top of the four fixed
    lines above (a client wants one more report, one more integration
    tweak); NOT sufficient to price an entire deal at — a whole deal
    priced purely on enhancement hours loses the product-fee economics
    this v4 model exists to capture. See Part 5.4: this rate must show on
    the client document as "quoted per request," never as the basis for
    a full-deal total.
  margin_disclosure_correction: >
    HONESTY-RULE DISCLOSURE (2026-08-16): the brief this catalogue was
    built from described 473/hr net as "20% over the commission-adjusted
    floor." Computed directly: 473 / 394.38 (the COST floor) = 1.1994,
    i.e. ~20.0% over the COST floor — that part of the framing is
    arithmetically correct if "the floor" means cost_floor_per_hour.
    But 473 / 458.58 (the actual BILLING floor, i.e. the one
    rate_guard_verdict() gates PASS/BLOCK on) = 1.0314, i.e. only ~3.1%
    over the BILLING floor, not 20%. The two floors were conflated in
    the brief's own phrasing. Computation wins per the standing honesty
    rule: 473/hr clears the billing floor (PASS via
    pe.rate_guard_verdict(473)) but with a genuinely thin ~3% margin, not
    the comfortable ~20% the original framing implied. Flagged here so
    nobody prices a deal against enhancement hours believing there is a
    20% cushion over the gate that actually governs quoting.
  provenance: "Owner-stated 2026-08-16 (rate); margin analysis computed this session, disagrees with the brief's own framing as disclosed above."

# ===========================================================================
# REFERENCE QUOTE — verified equal to platform + all 5 modules + migration band 2
# ===========================================================================
reference_quote:
  components:
    platform_fee_aed: 14000
    modules_subtotal_aed: 16000
    migration_band: band_2
    migration_aed: 5000
  total_aed: 35000    # 14000 + 16000 + 5000 = 35000, computed via pe.reference_quote_total_aed() and verified by direct execution before this file was committed; T20/T21 (pricing v4 Part 4 commit) add the standing regression test
  discount_floor_aed: 31500    # 35000 * 0.90 (10% discount), computed
  discount_floor_gate:
    below_discount_floor: commercial_desk_approval_required
    implementation: "05-ops/pricing_engine.py: discount_gate_verdict() — a real gate function, not a comment. Any total below discount_floor_aed returns APPROVAL_REQUIRED; validate.py/render path must refuse to issue a quote below the floor without a logged Commercial Desk approval record, same mechanism shape as concession-ladder.yaml's existing G14 logging requirement."
  provenance: "Owner-stated 2026-08-16; total independently verified by direct computation (14000+3000+3500+3500+3500+2500+5000=35000) before this file was written."

# ===========================================================================
# EXCLUDED / ENHANCEMENT REGISTER — capabilities with NO fixed price
