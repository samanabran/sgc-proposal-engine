  whatsapp_instant_notification:
    status: excluded
    fixed_price: null
    evidence: "00-intake/demo-presentation-inventory-2026-08-16.md §6.3/R2: class ABSENT — no WhatsApp provider configuration table anywhere in the schema; mail_mail shows only SMTP attempts (31 exception, 1 sent)."
    alternative_offered: "Email notification via the platform's existing SMTP path (see mail_mail evidence above for its current reliability, disclosed, not oversold)."
