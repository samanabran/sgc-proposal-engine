# is hours-based (9-13h), not a flat "2,500/3h" price, and was written for
# a DIFFERENT catalogue (custom/on-demand work, not template config).
# Nothing was deleted, because nothing under those names/prices existed to
# delete. What this section actually does: establishes, for the first
# time in this repo, an explicit no-fixed-price register for the five
# capabilities Part 5.4 requires named exclusions for, each cited against
# real evidence that the capability does not exist in the addons estate.
