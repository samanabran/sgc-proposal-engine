  automated_call_logging:
    status: excluded
    fixed_price: null
    evidence: "00-intake/demo-presentation-inventory-2026-08-16.md §6.5/R7: class ABSENT — stock Odoo 'Call' activity type exists but has 0 activities ever logged against it; no SGC-built call-log table found anywhere in the estate."
    alternative_offered: "Manual call notes via the CRM's existing activity/message log (mail.activity 'Call' type, present but unused today)."
    quotable_as: "enhancement hours after a scoping call — no existing build to price from."

  call_target_enforcement:
