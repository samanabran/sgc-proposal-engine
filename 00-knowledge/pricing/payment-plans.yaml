# SGC TECH AI — Payment Plans & Cadence (v2, new)
version: 2.0
effective_from: 2026-08-03

baseline: monthly_in_advance
discount_applies_to: platform_portion_only     # HARD RULE G11
recovery_portion_discountable: false            # HARD RULE G11
cadence_values_are_ceilings: true                # HARD RULE G12
min_cadence_current: quarterly_in_advance         # G33 until reserves reach 3mo opex

cadences:
  full_prepay_term:        { platform_adj_pct: -0.12, financing: remove_entirely, security: none }
  annual_in_advance:        { platform_adj_pct: -0.10, uplift_reduction_pp: 3.0, security: none }
  semi_annual_in_advance:    { platform_adj_pct: -0.05, uplift_reduction_pp: 1.0, security: none }
  quarterly_in_advance:       { platform_adj_pct: -0.03, uplift_reduction_pp: 0.5, security: none }
  monthly_in_advance:          { platform_adj_pct: 0.00, security: mobilisation_33pct, status: below_min_cadence }
  monthly_in_arrears:           { platform_adj_pct: 0.02,  uplift_surcharge_pp: 1.0, security: [deposit_1_month, pdc_set] }
  quarterly_in_arrears:          { platform_adj_pct: 0.05,  uplift_surcharge_pp: 2.0, security: [deposit_2_months, pdc_set] }
  deferred_start:
    platform_adj_pct_per_month: 0.01
    uplift_surcharge_pp_per_month: 1.0
    max_months: 3
    security: [pdc_full_deferred, deposit_2_months]
    approval: commercial_desk
  milestone_or_usage:            { treatment: escalate, approval: sales_leadership }

one_time_structures:
  build_full_upfront_platform_monthly: { uplift: 0, note: "cleanest deal available — build settled at kickoff, platform billed monthly thereafter" }
  build_full_upfront_platform_annual:   { uplift: 0, platform_adj_pct: -0.10, note: "best cash outcome for SGC" }
  one_time_no_subscription:
    treatment: refuse_framing
    reason: "hosting and support are recurring costs and cannot be capitalised into a single one-time fee without SGC absorbing perpetual cost-to-serve with no revenue behind it."
    counter: "offer build as one-time + platform recurring, minimum 12-month platform term."

hard_caps:
  max_total_give_pct_of_contract_value: 0.10
  combined_give_plus_guarantee_cap_pct: 0.12       # G31
  margin_floor_binding: true

withdrawn:
  option_b_zero_mobilisation:
    status: suspended
    reason: "peak cash exposure of AED 4,960 on a representative deal equals 35-70% of SGC's own liquid reserves (AED 7,000-14,000) — see 07-protection/exposure/portfolio-limits.yaml."
    reinstate_when: "liquid reserves reach 3 months opex"

notes:
  - "monthly_in_advance is flagged status: below_min_cadence — it requires the security instrument shown, is not the preferred structure, and is offered only when a client cannot accept quarterly (G33)."
  - "Every cadence's platform_adj_pct is a ceiling under G12 — the margin-floor ceiling calculation in the runbook may bind tighter than the table value; always apply the lower of the two."

financing_premium_disclosure_basis:
  # ADDED 2026-08-15 (RVN closing-pass audit). Every prior draft's
  # financing-premium disclosure (the plain-English "X% / AED Y" figure
  # required by clause-library/financing-disclosure.md, G7) was computed
  # from the PRE-ROUNDING subscription rate (platform_portion + recovery,
  # before policy.yaml: presentation.client_facing_subscription_rounding
  # rounds it to the nearest AED 10) rather than the rate the client is
  # actually billed. The two rates diverge by design whenever the raw sum
  # isn't already a multiple of 10, and the gap compounds over the term —
  # small per month, real in aggregate.
  rule: "The financing-premium disclosure (AED amount and %) MUST be computed from the ROUNDED client-facing subscription rate (policy.yaml: presentation.client_facing_subscription_rounding), never the pre-rounding raw sum. The raw sum may still be shown for transparency (it already is, in every worksheet's subscription_fee_aed_mo_raw field) but must never be the basis for the premium figure disclosed to the client."
  worked_example_rvn:
    financed_remainder_aed: 10269
    billed_monthly_aed: 1680          # rounded client-facing rate — CORRECT basis
    platform_only_monthly_aed: 1170   # the no-financing baseline (Option A)
    revenue_over_24mo_at_billed_rate: 40320   # 1680 x 24
    platform_baseline_over_24mo: 28080         # 1170 x 24
    financing_inclusive_difference: 12240       # 40320 - 28080
    correct_premium_aed: 1971                    # 12240 - 10269 (financed_remainder_aed)
    correct_premium_pct: 0.192                    # 1971 / 10269, rounds to 19.2%
    previously_used_basis: "AED 1,848 / 18% = recovery_total_aed(12117) - financed_remainder_aed(10269), i.e. the raw financing_uplift.months_24 rate (0.18) applied directly to the deferred principal, with no reference to the actual client-facing billed rate at all. That figure is not 'wrong' in isolation -- it is the mathematically exact uplift on the deferred principal, and will always equal exactly uplift_pct by construction. It understates the client's real all-in financing cost, though, because rounding subscription_fee_aed_mo up to the nearest 10 (policy.yaml) adds a second, separate premium on top of the disclosed uplift that this framing never surfaces. The rule above requires disclosing the SECOND, larger, all-in figure (AED 1,971 / 19.2%, comparing 24 months of the actual billed rate against the actual no-financing baseline) because that is what the client actually pays versus the alternative, not the uplift formula's own internal arithmetic. Corrected in 02-clients/RVN-realestate-leads/00-intake/SOW-and-commercial-terms-2026-08-15.md, section C-B."
